<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const HSL = (h,s,l) => new THREE.Color().setHSL((((h%360)+360)%360)/360, s, Math.min(Math.max(l,0),1));
function hashNoise(x,y,z){ const s=Math.sin(Math.round(x*997)*12.9898 + Math.round(y*997)*78.233 + Math.round(z*997)*37.719)*43758.5453; return s - Math.floor(s); }
function paint(geo, colorFn){
  const p = geo.attributes.position, arr = new Float32Array(p.count*3), v = new V3();
  for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const c=colorFn(v); arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr,3)); return geo;
}

// ---------- 재질 + PS1 꼭짓점 스냅 ----------
const PS1 = { uSnap:{ value:1 }, uRes:{ value:new THREE.Vector2(320,240) } };
function snappable(mat){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSnap = PS1.uSnap; sh.uniforms.uRes = PS1.uRes;
    sh.vertexShader = 'uniform float uSnap;\nuniform vec2 uRes;\n' + sh.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
      if (uSnap > 0.5) { vec4 sp = gl_Position; sp.xyz /= sp.w;
        sp.xy = floor(sp.xy * uRes * 0.5 + 0.5) / (uRes * 0.5); sp.xyz *= sp.w; gl_Position = sp; }`);
  };
  return mat;
}
const MAT = snappable(new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, side:THREE.DoubleSide, roughness:0.85 }));
const PAPER = snappable(new THREE.MeshStandardMaterial({ color:'#f3efe7', flatShading:true, side:THREE.DoubleSide, roughness:0.95 }));
const RIBBON = snappable(new THREE.MeshStandardMaterial({ color:'#9aa98a', flatShading:true, side:THREE.DoubleSide, roughness:0.7 }));

// ---------- 형태 부품 ----------
function strip({ L, W, nL, profile, curl=0, crease=0.12, serrate=0, wobble=0, ws=0, colorAt }){
  const nW=2, pos=[], col=[], idx=[];
  for (let i=0;i<=nL;i++){
    const t=i/nL; let w=W*profile(t);
    if (serrate && i>0 && i<nL && i%2===1) w *= (1-serrate);
    const yC = (curl + CURL*0.9)*L*t*t;
    for (let j=0;j<=nW;j++){
      const u=j/nW*2-1;
      let y = yC + Math.abs(u)*w*crease;
      if (wobble) y += (hashNoise(i*1.7+ws, j*2.3, ws*0.37)-0.5) * wobble * t*t;
      pos.push(t*L, y, u*w*0.5);
      const c=colorAt(t,u); col.push(c.r,c.g,c.b);
    }
  }
  for (let i=0;i<nL;i++) for (let j=0;j<nW;j++){ const a=i*(nW+1)+j, b=a+1, c=a+nW+1, d=c+1; idx.push(a,c,b, b,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); return g;
}
const roundTip = (base,c) => t => t<c ? base+(1-base)*Math.sin(t/c*Math.PI/2) : Math.sqrt(Math.max(0, 1-((t-c)/(1-c))**2));
const pointed  = t => Math.pow(1-t, 0.8) * (t<0.15 ? 0.55+3*t : 1);
const leafy    = t => Math.max(0.12, Math.sin(Math.PI*Math.pow(t,0.75)));

// 원형 잎(유칼립투스): 가장자리가 원점에 붙고 +x로 뻗는 오목한 원판
function disc(R, seg, cup, rng, colorAt){
  const pos=[0,0,0].map((v,i)=> i===0 ? R : 0), col=[], idx=[];
  const c0 = colorAt(0); col.push(c0.r,c0.g,c0.b);
  for (let s=0;s<seg;s++){
    const a=s/seg*Math.PI*2, rr=R*(0.92+rng()*0.12);
    pos.push(R + Math.cos(a)*rr, cup*R, Math.sin(a)*rr);
    const c=colorAt(1); col.push(c.r,c.g,c.b);
  }
  for (let s=0;s<seg;s++) idx.push(0, 1+s, 1+(s+1)%seg);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); return g;
}

function mesh(geo){ return new THREE.Mesh(geo, MAT); }
function tube(curve, radius, radial, colorFn, segs=10){
  return mesh(paint(new THREE.TubeGeometry(curve, segs, radius, radial, false), colorFn));
}
function dome(r, sy, colorFn, bump){
  const g = new THREE.SphereGeometry(r, 10, 5, 0, Math.PI*2, 0, Math.PI/2);
  const p=g.attributes.position, v=new V3();
  for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n=hashNoise(v.x,v.y,v.z); v.multiplyScalar(1+(n-0.5)*bump); v.y*=sy; p.setXYZ(i,v.x,v.y,v.z); }
  return mesh(paint(g, v => colorFn(hashNoise(v.x*3,v.y*3,v.z*3))));
}
// 피벗(y 회전) + 들림(z 회전)
function place(parent, geo, angle, lift, offset=0, y=0){
  const pv=new THREE.Group(); pv.rotation.y=angle; pv.position.y=y;
  const m=mesh(geo); m.rotation.z=lift; m.position.x=offset; pv.add(m); parent.add(pv); return pv;
}
// 줄기 위 한 점에 부품을 붙이기: 부품의 +x가 dir을 향하고, 부품 평면이 줄기 방향을 품도록
function attach(parent, geo, pos, dir, tan, twist=0){
  const x = dir.clone().normalize();
  let z = tan.clone().addScaledVector(x, -x.dot(tan));
  if (z.lengthSq() < 1e-6) z = new V3(0,0,1); z.normalize();
  const y = new V3().crossVectors(z, x);
  const m = mesh(geo);
  const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
  m.quaternion.copy(q); m.rotateX(twist); m.position.copy(pos); parent.add(m); return m;
}
function sideVec(tan, angle){
  const ref = Math.abs(tan.y) < 0.9 ? new V3(0,1,0) : new V3(1,0,0);
  const a = new V3().crossVectors(tan, ref).normalize(), b = new V3().crossVectors(tan, a).normalize();
  return a.multiplyScalar(Math.cos(angle)).addScaledVector(b, Math.sin(angle));
}
let FACE_BIAS = 0; const FRONT = new V3(0,0.3,1).normalize();
let SIZE = 1, CURL = 0;   // 송이별 크기 배율, 다발 전체의 말림 정도
function headAt(parent, curve, head){
  head.position.copy(curve.getPoint(1));
  head.quaternion.setFromUnitVectors(new V3(0,1,0), curve.getTangent(1).lerp(FRONT, FACE_BIAS).normalize());
  head.scale.setScalar(SIZE);
  parent.add(head);
}
const greenStem = v => HSL(100, 0.4, 0.3);
function stemLeaves(g, curve, rng, n, L, W){
  for (let i=0;i<n;i++){
    const t = 0.5 + rng()*0.25, p = curve.getPoint(t), tan = curve.getTangent(t);
    const geo = strip({ L:L*(0.85+rng()*0.3), W, nL:5, profile:pointed, curl:-0.35, crease:0.2, colorAt:t2 => HSL(102,0.42,0.28+t2*0.08) });
    attach(g, geo, p, sideVec(tan, rng()*6.28).addScaledVector(tan, 0.9), tan, rng()*0.6);
  }
}

// ---------- 델피늄 공용 부품 ----------
// 꽃 한 송이(작은 꽃): 꽃받침 5장 + 가운데 무늬 + 뒤쪽 꿀주머니(spur). 머리의 +y가 dir을 향함
function floret(g, pos, dir, s, it, rng, sat){
  s *= SIZE;
  const head = new THREE.Group(), L0 = it.lightness/100;
  const base = HSL(it.hue, sat, L0 + (rng()-.5)*0.06), tint = HSL(it.hue+42, sat*0.8, L0+0.03), eye = HSL(it.hue+10, 0.3, 0.88);
  for (let i=0;i<5;i++){
    const geo = strip({ L:0.022*s*(0.9+rng()*0.2), W:0.018*s, nL:3, profile:roundTip(0.35,0.55), curl:-0.1, crease:0.1,
      colorAt:(t,u) => base.clone().lerp(tint, Math.max(0,t-0.5)*1.1).lerp(eye, Math.max(0,(0.2-t)/0.2)*0.5) });
    place(head, geo, i/5*Math.PI*2 + (rng()-.5)*0.3, 0.12 + (rng()-.5)*0.2, 0.002*s);
  }
  const dark = rng() < 0.5;
  const c = mesh(paint(new THREE.IcosahedronGeometry(0.0035*s, 0), () => HSL(it.hue+20, 0.25, dark ? 0.22 : 0.86)));
  c.position.y = 0.002*s; head.add(c);
  const spur = mesh(paint(new THREE.ConeGeometry(0.0038*s, 0.016*s, 4, 1), () => base));
  spur.rotation.x = Math.PI; spur.position.y = -0.008*s; head.add(spur);
  head.position.copy(pos); head.quaternion.setFromUnitVectors(new V3(0,1,0), dir.clone().normalize()); g.add(head);
}
// 봉오리: 길쭉한 연두색 알, 가끔 끝이 파랗게 물듦
function bud(g, pos, dir, s, rng, blueTip, it){
  s *= SIZE;
  const geo = new THREE.SphereGeometry(0.0055*s, 6, 4); geo.scale(1, 1.7, 1);
  paint(geo, v => (blueTip && v.y > 0.003*s) ? HSL(it.hue, 0.45, 0.58) : HSL(72, 0.5, 0.66 + Math.max(0, v.y)/(0.01*s)*0.06));
  const m = mesh(geo); m.position.copy(pos).addScaledVector(dir.clone().normalize(), 0.006*s);
  m.quaternion.setFromUnitVectors(new V3(0,1,0), dir.clone().normalize()); g.add(m);
}
function pedicel(g, a, b){ g.add(tube(new THREE.LineCurve3(a, b), 0.0012, 3, greenStem, 1)); }

// ---------- 종류별 꽃 ----------
const TYPES = {
  lisianthus: { label:'리시안셔스', dot:'#f4f1ea', len:0.38, sat:0.35,
    color: rng => [[90,93],[330,86],[275,82],[90,93]][Math.floor(rng()*4)],
    make(it, rng, curve){

// 꽃다발 속 역할: 앞(메인 꽃) · 중간(필러) · 뒤(소재)
const ROLE = { rose:'front', lisianthus:'front', daisy:'front', marigold:'front', asclepias:'middle', delphSpray:'middle', delphSpike:'back', eucalyptus:'back', bori:'back' };
const BAND = { front:[0.0,0.36], middle:[0.3,0.68], back:[0.58,1.0] };   // 깊이 v: 0 = 받는 사람 쪽, 1 = 맨 뒤
const layout = { mode:'facade', variation:0.25, curl:0, sizeVar:0.25 };

// ---------- 한 송이를 메시 하나로 합치기 ----------
function bake(group, material){
  group.updateMatrixWorld(true);
  const inv = group.matrixWorld.clone().invert(), geos = [];
  group.traverse(o => {
    if (!o.isMesh) return;
    let g = o.geometry.clone();
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'color') g.deleteAttribute(k);
    if (g.index) g = g.toNonIndexed();
    geos.push(g); o.geometry.dispose();
  });
  const merged = mergeGeometries(geos); geos.forEach(g => g.dispose());
  const m = new THREE.Mesh(merged, material); m.castShadow = true; return m;
}

// ---------- 다발 데이터 ----------
const INITIAL = ['lisianthus','eucalyptus','asclepias','bori','daisy','eucalyptus','lisianthus','bori','asclepias','eucalyptus',
  'marigold','bori','eucalyptus','asclepias','lisianthus','eucalyptus','bori','asclepias','eucalyptus','bori','daisy','eucalyptus'];
let master = 20261107;
const seedRng = () => { master = (master * 1103515245 + 12345) % 2147483648; return master; };
function newItem(type){
  const seed = seedRng(), [hue, lightness] = TYPES[type].color(mulberry32(seed ^ 0x9e37));
  return { type, hue:Math.round(hue), lightness:Math.round(lightness), seed };
}
let items = INITIAL.map(newItem);

// ---------- 다발 배치 ----------
const GA = Math.PI * (3 - Math.sqrt(5));  // 황금각
const TIE = new V3(0, 0.42, 0);
function paperSheet(a0, a1, rBot, rTop, yBot, H0, rng, amp=0.07){
  const segA=7, segH=3, pos=[], idx=[];
  for (let h=0;h<=segH;h++){
    const hh=h/segH;
    for (let s=0;s<=segA;s++){
      const a=a0+(a1-a0)*s/segA, H=H0 + amp*(-Math.sin(a));
      let r=rBot+(rTop-rBot)*Math.pow(hh,1.05), y=yBot+hh*H;
      if (h===segH){ r += (rng()-.5)*0.03; y += (rng()-.5)*0.03; }
      pos.push(Math.cos(a)*r, y, Math.sin(a)*r);
    }
  }
  for (let h=0;h<segH;h++) for (let s=0;s<segA;s++){ const a=h*(segA+1)+s, b=a+1, c=a+segA+1, d=c+1; idx.push(a,c,b, b,c,d); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  const m=new THREE.Mesh(g, PAPER); m.castShadow=true; return m;
}

let triCount = 0;
function buildBouquet(){
  const group = new THREE.Group(), N = items.length;
  const phiMax = 0.5 + 0.35*Math.min(1, N/45);
  triCount = 0; CURL = layout.curl;
  const grow = Math.min(1, N/45), roleN = {}, roleI = {};
  for (const it of items) roleN[ROLE[it.type]] = (roleN[ROLE[it.type]]||0) + 1;
  items.forEach((it, k) => {
    const T = TYPES[it.type], rng = mulberry32(it.seed);
    let d, L;
    if (layout.mode === 'facade'){
      // 역할 띠 안에서 해바라기 나선으로 자리 잡기: 먼저 온 꽃이 띠의 가운데
      const role = ROLE[it.type], i = roleI[role] = (roleI[role]||0), n = roleN[role]; roleI[role]++;
      const r = Math.sqrt((i+0.5)/n), a = i*GA + (rng()-.5)*0.3;
      const u = r*Math.cos(a), w = r*Math.sin(a), [v0,v1] = BAND[role];
      // 구역 크기: 이 역할에 들어간 송이 수에 비례해 넓어짐 (면적 ∝ 송이 수 → 폭 ∝ √n)
      const N0 = { front:6, middle:5, back:12 }[role], zone = Math.sqrt(Math.max(n, N0)/N0);
      const bandW = (v1-v0) * (role==='front' ? Math.min(1.5, Math.pow(zone, 0.35)) : 1);
      let v = v0 + bandW*(w*0.5+0.5);
      v = Math.min(1, Math.max(0, v + (rng()-.5)*layout.variation*0.9));     // 변주: 역할 띠를 벗어나는 정도
      const spread = (0.45 + 0.4*grow) * (role==='front' ? 0.85 : 1) * Math.min(2.2, Math.pow(zone, 0.85));
      const lean = (0.9 - 1.25*v) * (0.6 + 0.35*grow) * (role==='front' ? Math.min(1.8, Math.pow(zone, 0.45)) : 1);                       // 앞은 받는 사람 쪽으로 기울고, 뒤는 곧게 서거나 살짝 뒤로
      d = new V3(u*spread, 1, lean).normalize();
      L = T.len * (0.74 + 0.55*v) * (0.92+rng()*0.16);                        // 뒤로 갈수록 계단식으로 높아짐
      FACE_BIAS = role==='front' ? 0.35 : 0.1;
    } else {
      const rf = Math.sqrt((k+0.5)/N), a = k*GA + (rng()-.5)*0.3, phi = rf*phiMax + (rng()-.5)*0.08;
      d = new V3(Math.sin(phi)*Math.cos(a), Math.cos(phi), Math.sin(phi)*Math.sin(a));
      L = T.len * (1-0.12*rf) * (0.92+rng()*0.16);
      FACE_BIAS = 0;
    }
    // 크기 랜덤: 시드에서 따로 뽑아서 다른 무작위 값(꽃잎 각도 등)은 그대로 유지
    const sr = mulberry32(it.seed ^ 0x5bd1e995);
    SIZE = Math.exp((sr()*2-1) * layout.sizeVar * 0.5);
    L *= Math.pow(SIZE, 0.35);
    // 꽃대 말림: +면 바깥으로 휘며 고개를 숙이고, -면 안쪽으로 모임
    const hd = new V3(d.x, 0, d.z);
    if (hd.lengthSq() < 1e-4) hd.set(Math.cos(it.seed), 0, Math.sin(it.seed));
    hd.normalize();
    const tip = TIE.clone().addScaledVector(d, L).addScaledVector(hd, L*0.28*CURL).add(new V3(0, -L*0.18*Math.max(0,CURL)*CURL, 0));
    const bottom = new V3(-d.x*0.04+(rng()-.5)*0.015, TIE.y-0.32, -d.z*0.04+(rng()-.5)*0.015);
    const mid = TIE.clone().addScaledVector(d, L*0.55).addScaledVector(hd, L*0.07*CURL).add(new V3((rng()-.5)*0.03, 0, (rng()-.5)*0.03));
    const curve = new THREE.CatmullRomCurve3([bottom, TIE.clone().addScaledVector(d,0.012), mid, tip]);
    const m = bake(T.make(it, rng, curve), MAT);
    triCount += m.geometry.attributes.position.count/3;
    group.add(m);
  });
  // 포장지 3장 + 리본
  const prng = mulberry32(7), rTop = 0.19 + 0.07*Math.min(1, N/45);
  [[0,4.6,0.2],[2.1,6.7,0.24],[4.2,8.8,0.22]].forEach(([a0,a1,h]) => group.add(paperSheet(a0,a1,0.045,rTop,TIE.y-0.27,h+0.18+0.04*Math.min(1,N/45),prng, layout.mode==='facade'?0.13:0.07)));
  const ribbon = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.066,0.028,10,1,true), RIBBON);
  ribbon.position.y = TIE.y-0.235; ribbon.castShadow = true; group.add(ribbon);
  // 쪽지 카드: 포장지 앞쪽 가장자리에 꽂아 둠
  const card = makeCard(); card.position.set(0.05, TIE.y+0.03, rTop+0.01); card.rotation.set(-0.28, 0.18, 0.05); group.add(card);
  return group;
}

// ---------- 쪽지 카드 ----------
const NOTE = { text:'여기에 편지를 적어 주세요.\n\n꽃다발 앞의 카드를 누르면\n이 글이 열려요.' };
function noteTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=176; const x=c.getContext('2d');
  x.fillStyle='#fbf7ee'; x.fillRect(0,0,256,176);
  x.strokeStyle='#d2c3ae'; x.lineWidth=5; x.strokeRect(12,12,232,152);
  x.fillStyle='#6b5a4e'; x.textAlign='center';
  x.font='italic 600 44px Georgia, serif'; x.fillText('for you', 128, 92);
  x.font='22px sans-serif'; x.fillStyle='#9b8a7c'; x.fillText('눌러서 열기', 128, 134);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.magFilter=THREE.NearestFilter; return t;
}
const CARD_FACE = snappable(new THREE.MeshStandardMaterial({ map:noteTexture(), roughness:0.9 }));
const CARD_EDGE = snappable(new THREE.MeshStandardMaterial({ color:'#efe6d6', roughness:0.9 }));
let noteMesh = null;
function makeCard(){
  const grp = new THREE.Group();
  const card = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.076, 0.002), [CARD_EDGE,CARD_EDGE,CARD_EDGE,CARD_EDGE,CARD_FACE,CARD_EDGE]);
  card.position.y = 0.05; card.castShadow = true; grp.add(card);
  const pick = new THREE.Mesh(new THREE.CylinderGeometry(0.0015, 0.0015, 0.12, 4), RIBBON);
  pick.position.set(0, -0.005, -0.035); pick.rotation.x = 0.75; grp.add(pick);
  noteMesh = card; return grp;
}


// ---------- 펼쳐지는 편지 카드 (3D 안에서 그려서 PS1 효과가 그대로 적용됨) ----------
const CW = 0.11, CH = 0.076;   // 꽃다발 속 카드와 같은 크기. 펼치면 CW × 2CH(세로로 긴 편지)
function wrapText(x, text, maxW){
  const out = [];
  for (const para of text.split('\n')){
    if (!para){ out.push(''); continue; }
    let line = '';
    for (const ch of para){ const t = line + ch; if (x.measureText(t).width > maxW && line && !/[.,!?~)」』”’]/.test(ch)){ out.push(line); line = ch; } else line = t; }
    out.push(line);
  }
  return out;
}
function letterTexture(text){
  const c = document.createElement('canvas'); c.width = 512; c.height = 708; const x = c.getContext('2d');
  x.fillStyle = '#fbf7ee'; x.fillRect(0,0,512,708);
  x.strokeStyle = '#d2c3ae'; x.lineWidth = 6; x.strokeRect(16,16,480,676);
  x.strokeStyle = 'rgba(150,130,110,.28)'; x.lineWidth = 2; x.beginPath(); x.moveTo(24,354); x.lineTo(488,354); x.stroke();  // 접힌 자국
  let size = 34, lines = [];
  for (; size >= 14; size -= 2){ x.font = `${size}px "Nanum Myeongjo", "AppleMyungjo", Georgia, serif`; lines = wrapText(x, text, 410); if (lines.length*size*1.75 <= 600) break; }
  x.fillStyle = '#4a3a30'; x.textBaseline = 'top';
  const lh = size*1.75; let y = (708 - lines.length*lh)/2;
  for (const l of lines){ x.fillText(l, 50, y); y += lh; }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter;
  return t;
}
const ONTOP = { depthTest:false, depthWrite:false, transparent:true };   // 편지는 항상 맨 앞에 그림
const COVER_FACE = snappable(new THREE.MeshBasicMaterial({ map:noteTexture(), ...ONTOP }));
const DIM = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({ color:'#2b1d22', transparent:true, opacity:0, ...ONTOP }));
DIM.renderOrder = 998;
const letter = { state:'closed', t:0, group:null, pivot:null, mats:[], p0:new V3(), q0:new THREE.Quaternion() };

function buildLetterCard(){
  const tex = letterTexture(NOTE.text);
  const top = tex.clone(); top.repeat.set(1, 0.5); top.offset.set(0, 0.5); top.needsUpdate = true;
  const bot = tex.clone(); bot.repeat.set(1, 0.5); bot.offset.set(0, 0);   bot.needsUpdate = true;
  const mTop = snappable(new THREE.MeshBasicMaterial({ map:top, ...ONTOP })), mBot = snappable(new THREE.MeshBasicMaterial({ map:bot, ...ONTOP }));
  const g = new THREE.Group();
  const inside = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), mBot); inside.renderOrder = 1000; g.add(inside);            // 아래 절반(안쪽 면)
  const pivot = new THREE.Group(); pivot.position.set(0, CH/2, 0.0008); g.add(pivot);             // 위쪽 모서리가 경첩
  const front = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), COVER_FACE); front.position.y = -CH/2; front.renderOrder = 1002; pivot.add(front);
  const back  = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), mTop); back.position.set(0, -CH/2, -0.0004); back.rotation.x = Math.PI; back.renderOrder = 1001; pivot.add(back);  // 표지 뒷면 = 위 절반
  letter.mats = [mTop, mBot, tex, top, bot];
  return { g, pivot };
}
function openLetter(){
  if (letter.state !== 'closed' || !noteMesh) return;
  const h = document.getElementById('hint'); if (h) h.style.opacity = 0;
  const { g, pivot } = buildLetterCard();
  noteMesh.getWorldPosition(letter.p0); noteMesh.getWorldQuaternion(letter.q0);
  letter.group = g; letter.pivot = pivot; scene.add(g); scene.add(DIM);
  noteMesh.visible = false; controls.enabled = false;
  letter.state = 'opening'; letter.t = 0;
}
function closeLetter(){ if (letter.state === 'opening' || letter.state === 'open') letter.state = 'closing'; }
function letterTarget(){
  const d = 0.6, dir = new V3(0,0,-1).applyQuaternion(camera.quaternion), up = new V3(0,1,0).applyQuaternion(camera.quaternion);
  const visH = 2*d*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), visW = visH*camera.aspect;
  const s = Math.min(0.8*visH/(2*CH), 0.88*visW/CW);
  const pos = camera.position.clone().addScaledVector(dir, d).addScaledVector(up, -s*CH/2);   // 펼친 카드 전체가 화면 가운데 오도록
  return { pos, q:camera.quaternion.clone(), s };
}
const ease = x => x<0 ? 0 : x>1 ? 1 : x*x*(3-2*x);
function updateLetter(dt){
  if (letter.state === 'closed') return;
  if (letter.state === 'opening'){ letter.t = Math.min(1, letter.t + dt/1.4); if (letter.t >= 1) letter.state = 'open'; }
  if (letter.state === 'closing'){ letter.t = Math.max(0, letter.t - dt/0.9); }
  const fly = ease(letter.t/0.6), open = ease((letter.t-0.45)/0.55), T = letterTarget();
  const g = letter.group;
  g.position.lerpVectors(letter.p0, T.pos, fly);
  g.quaternion.copy(letter.q0).slerp(T.q, fly);
  g.rotateY(Math.PI*2*(1-fly));                        // 날아오면서 한 바퀴
  g.scale.setScalar(1 + (T.s-1)*fly);
  letter.pivot.rotation.x = -Math.PI*open;             // 표지가 위로 넘어가며 펼쳐짐
  // 뒤를 살짝 어둡게
  const dd = 0.9, dir = new V3(0,0,-1).applyQuaternion(camera.quaternion);
  DIM.position.copy(camera.position).addScaledVector(dir, dd); DIM.quaternion.copy(camera.quaternion); DIM.scale.set(10,10,1);
  DIM.material.opacity = 0.35*fly;
  if (letter.state === 'closing' && letter.t <= 0){
    scene.remove(g); scene.remove(DIM); g.traverse(o => o.geometry && o.geometry.dispose());
    letter.mats.forEach(m => m.dispose()); letter.group = null;
    if (noteMesh) noteMesh.visible = true; controls.enabled = true; letter.state = 'closed';
  }
}

// ---------- 장면 ----------
const canvas=document.getElementById('c'), stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#d9829c');
const camera=new THREE.PerspectiveCamera(35,1,0.01,50); camera.position.set(0.25,0.8,2.15);
const controls=new OrbitControls(camera, canvas);
controls.target.set(0,0.62,0); controls.enableDamping=true; controls.minDistance=0.5; controls.maxDistance=5; controls.maxPolarAngle=Math.PI*0.55;
scene.add(new THREE.HemisphereLight('#fff6f2','#f0d0d8',1.3));
const fill=new THREE.DirectionalLight('#ffffff',0.6); fill.position.set(0,0.4,2); scene.add(fill);
const sun=new THREE.DirectionalLight('#fff4e6',2.0); sun.position.set(1.2,2.6,1.4); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.radius=6;
Object.assign(sun.shadow.camera,{ left:-1, right:1, top:1.2, bottom:-1, near:0.5, far:7 }); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.ShadowMaterial({ opacity:0.2 }));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// PS1 후처리
const ps1={ on:true, height:350 };
const rt=new THREE.WebGLRenderTarget(320,240,{ minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });
const postScene=new THREE.Scene(), postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postMat=new THREE.ShaderMaterial({
  uniforms:{ tDiffuse:{ value:rt.texture }, uSize:{ value:new THREE.Vector2(320,240) }, uLevels:{ value:32 } },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform vec2 uSize; uniform float uLevels; varying vec2 vUv;
    float bayer(vec2 p){ int x=int(mod(p.x,4.0)), y=int(mod(p.y,4.0)); int m[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5); return float(m[x+y*4])/16.0-0.5; }
    void main(){ gl_FragColor=vec4(texture2D(tDiffuse,vUv).rgb,1.0);
      #include <colorspace_fragment>
      float d=bayer(floor(vUv*uSize))/uLevels; gl_FragColor.rgb=floor((gl_FragColor.rgb+d)*uLevels+0.5)/uLevels; }`,
  depthTest:false, depthWrite:false });
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));
function sizePS1(){ const h=ps1.height, w=Math.max(16,Math.round(h*camera.aspect)); rt.setSize(w,h); postMat.uniforms.uSize.value.set(w,h); PS1.uRes.value.set(w,h); }
function resize(){ const w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w/h<1?46:35; camera.updateProjectionMatrix(); sizePS1(); }
new ResizeObserver(resize).observe(stage); resize();

let bouquet=null, dirty=true, giftIntro=null;
function rebuild(){
  if (bouquet){ scene.remove(bouquet); bouquet.traverse(o => o.geometry && o.geometry.dispose()); }
  bouquet=buildBouquet(); bouquet.position.y=0.06; scene.add(bouquet); dirty=false; updateUI();
}
const clock=new THREE.Clock(); let frames=0, acc=0, fps=0, calls=0;
renderer.setAnimationLoop(() => {
  if (dirty) rebuild();
  const dt=clock.getDelta(), t=clock.elapsedTime;
  frames++; acc+=dt; if (acc>=0.5){ fps=Math.round(frames/acc); frames=0; acc=0; updateStats(); }
  bouquet.rotation.z=Math.sin(t*0.7)*0.012; bouquet.rotation.y=Math.sin(t*0.25)*0.05;
  if (noteMesh) noteMesh.scale.setScalar(1 + Math.sin(t*2.6)*0.035);
  updateLetter(dt);
  if (giftIntro){
    const e = (performance.now() - giftIntro.start)/1000, k = Math.min(1, Math.max(0, (e-1.2)/2.4));
    const h = Math.round(36 + (giftIntro.target-36)*k*k);
    if (h !== ps1.height){ ps1.height = h; sizePS1(); }
    if (k >= 1) giftIntro = null;
  }
  controls.update();
  if (ps1.on){ renderer.setRenderTarget(rt); renderer.render(scene,camera); calls=renderer.info.render.calls; renderer.setRenderTarget(null); renderer.render(postScene,postCam); }
  else { renderer.render(scene,camera); calls=renderer.info.render.calls; }
});

// ---------- UI ----------
const $=id=>document.getElementById(id);
function counts(){ const c={}; for (const it of items) c[it.type]=(c[it.type]||0)+1; return c; }
function updateStats(){
  const bytes = new Blob([JSON.stringify(items)]).size;
  $('stats').innerHTML = `${items.length}송이 · 삼각형 ${Math.round(triCount).toLocaleString()}개<br>FPS ${fps} · 그리기 호출 ${calls}회<br>다발 데이터 ${(bytes/1024).toFixed(1)}KB`;
}
function updateUI(){
  const c=counts();
  for (const b of allAddButtons) b.querySelector('b').textContent = c[b.dataset.k]||0;
  updateStats();
}
const allAddButtons = [];
for (const k in TYPES){
  const b=document.createElement('button'); b.dataset.k=k;
  b.innerHTML=`<i style="background:${TYPES[k].dot}"></i>${TYPES[k].label} <b>0</b>`;
  b.onclick=()=>{ items.push(newItem(k)); dirty=true; };
  document.querySelector(`.grid[data-role="${ROLE[k]}"]`).appendChild(b); allAddButtons.push(b);
}
for (const b of $('layoutSeg').children) b.onclick = () => {
  layout.mode = b.dataset.k; [...$('layoutSeg').children].forEach(x => x.classList.toggle('on', x===b));
  $('varRow').hidden = layout.mode !== 'facade'; dirty = true;
};
$('variation').addEventListener('input', e => { layout.variation = +e.target.value; $('vVar').textContent = Math.round(layout.variation*100)+'%'; dirty = true; });
$('vVar').textContent = Math.round(layout.variation*100)+'%';
const curlLabel = v => Math.abs(v) < 0.02 ? '기본' : (v > 0 ? '말림 +' : '젖힘 ') + v.toFixed(2);
$('curl').addEventListener('input', e => { layout.curl = +e.target.value; $('vCurl').textContent = curlLabel(layout.curl); dirty = true; });
$('sizeVar').addEventListener('input', e => { layout.sizeVar = +e.target.value; $('vSize').textContent = Math.round(layout.sizeVar*100)+'%'; dirty = true; });
$('vCurl').textContent = curlLabel(layout.curl); $('vSize').textContent = Math.round(layout.sizeVar*100)+'%';
const keys=Object.keys(TYPES), weights={ rose:1.5, lisianthus:2, daisy:1.5, marigold:1, eucalyptus:3, bori:2, asclepias:2, delphSpray:1.5, delphSpike:1 };
function randomType(){ const tot=keys.reduce((s,k)=>s+weights[k],0); let r=Math.random()*tot; for (const k of keys){ r-=weights[k]; if (r<=0) return k; } return keys[0]; }
$('add10').onclick=()=>{ for (let i=0;i<10;i++) items.push(newItem(randomType())); dirty=true; };
$('add50').onclick=()=>{ for (let i=0;i<50;i++) items.push(newItem(randomType())); dirty=true; };
$('reseed').onclick=()=>{ items=items.map(it=>({ ...it, seed:seedRng() })); dirty=true; };
$('reset').onclick=()=>{ master=20261107; items=INITIAL.map(newItem); dirty=true; };
$('clear').onclick=()=>{ items=[]; dirty=true; };
$('ps1').addEventListener('change', e=>{ ps1.on=e.target.checked; PS1.uSnap.value=ps1.on?1:0; $('ps1ResRow').hidden=!ps1.on; });
$('ps1res').addEventListener('input', e=>{ ps1.height=+e.target.value; $('vRes').textContent=ps1.height+'p'; sizePS1(); });
$('vRes').textContent=ps1.height+'p';
// 쪽지: 카드 클릭(드래그가 아닌 짧은 탭)으로 열기
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let downAt = null;
function hitNote(e){
  if (!noteMesh) return false;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera); return ray.intersectObject(noteMesh, false).length > 0;
}
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt) return; const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]); downAt = null;
  if (moved >= 8) return;
  if (letter.state !== 'closed') closeLetter(); else if (hitNote(e)) openLetter();
});
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !downAt) canvas.style.cursor = (letter.state !== 'closed' || hitNote(e)) ? 'pointer' : ''; });
$('noteText').value = NOTE.text;
$('noteText').addEventListener('input', e => { NOTE.text = e.target.value; });
// 공유용 코드: 지금 다발의 송이 목록·배치 설정·편지를 그대로 담음
$('exportBtn').onclick = () => {
  const code = JSON.stringify({ v:1, items, layout:{ ...layout }, ps1:{ on:ps1.on, height:ps1.height }, note:NOTE.text });
  const out = $('exportOut'); out.hidden = false; out.value = code; out.select();
  const done = msg => { $('exportBtn').textContent = msg; };
  try { navigator.clipboard.writeText(code).then(() => done('복사됨! 대화창에 붙여넣어 주세요'), () => done('아래 코드를 길게 눌러 복사해 주세요')); }
  catch (e) { done('아래 코드를 길게 눌러 복사해 주세요'); }
};
// 선물 모드: 페이지에 window.GIFT가 있으면 그 다발을 그대로 보여주고 실험용 패널은 숨김
if (window.GIFT){
  const G = window.GIFT;
  items = G.items.map(x => {
    if (x.hue != null) return { ...x };
    const [hue, lightness] = TYPES[x.type].color(mulberry32(x.seed ^ 0x9e37));   // 색이 없으면 시드로 정함
    return { ...x, hue:Math.round(hue), lightness:Math.round(lightness) };
  });
  Object.assign(layout, G.layout);
  NOTE.text = G.note;
  ps1.on = G.ps1.on; ps1.height = G.ps1.height; PS1.uSnap.value = ps1.on ? 1 : 0; sizePS1();
  document.body.classList.add('gift'); resize(); dirty = true;
  // 처음 열 때: 아주 거친 픽셀에서 시작해 정해진 해상도까지 서서히 선명해짐
  if (ps1.on){ giftIntro = { target:ps1.height, start:performance.now() }; ps1.height = 36; sizePS1(); }
}
</script>
