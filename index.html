<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bce1da">
<title>꽃망울</title>
<!-- Vite 없이 정적 서버로 열어 볼 때도 three를 찾도록(Vite 개발·빌드에서는 node_modules의 three가 쓰임) -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<!-- 오류가 나면 화면 위에 붉은 상자로 알려 줌(휴대폰에서 배경만 보일 때 원인을 바로 보기 위해). 정상이면 보이지 않음 -->
<script>
(function(){
  var box;
  function show(m){ if(!box){ box=document.createElement('pre'); box.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:8px;background:#b3203f;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:55vh;overflow:auto'; document.documentElement.appendChild(box); } box.textContent += m + String.fromCharCode(10); }
  window.__showErr = show;
  addEventListener('error', function(e){ show('오류: ' + (e.message||'') + ' @' + String(e.filename||'').split('/').pop() + ':' + (e.lineno||'')); });
  addEventListener('unhandledrejection', function(e){ show('약속 오류: ' + (e.reason && (e.reason.message||e.reason))); });
  setTimeout(function(){ if(!window.__ready) show('4초가 지나도 화면이 만들어지지 않았어요 (UA: ' + navigator.userAgent + ')'); }, 4000);
})();
</script>
<link rel="stylesheet" href="/src/theme.css">
<link rel="stylesheet" href="/src/parts.css">
</head>
<body>
<div id="stage3d"></div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
