<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감사 스냅 v0</title>
<style>
  :root { --bg:#ece7df; --ink:#2a2622; --muted:#7a7066; --line:#ddd3c3; --card:#fbf8f2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
  body { min-height:100vh; }
  #wrap { max-width:520px; margin:0 auto; padding:14px 14px 40px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin:2px 4px 12px; }
  header h1 { font-size:16px; margin:0; }
  header span { font-size:12px; color:var(--muted); }

  /* 사진 */
  #stageBox { display:flex; justify-content:center; padding:6px 0 18px; }
  #photo { position:relative; --fc:#fbfaf7; --ft:#2a2622; background:var(--fc); color:var(--ft);
    box-shadow:0 10px 28px rgba(60,40,30,.18), 0 1px 3px rgba(0,0,0,.08); transform:rotate(-1.2deg); transition:background .3s; }
  #c { position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
  .cells { position:relative; z-index:2; display:flex; flex-direction:column; }
  .cell { position:relative; overflow:visible; cursor:pointer; }
  .cell .dim { position:absolute; inset:0; background:rgba(20,18,22,.38); transition:opacity .25s; }
  .cell .count { position:absolute; right:8px; top:6px; font:700 18px/1 ui-rounded, -apple-system, sans-serif; color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.4); opacity:0; }
  .cell .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .cell .flash.go { animation:flash .55s ease-out; }
  @keyframes flash { 0%{opacity:.95} 100%{opacity:0} }
  .cell .live { position:absolute; left:6px; top:6px; display:flex; align-items:center; gap:3px; padding:2px 6px 2px 4px; border-radius:999px;
    background:rgba(255,255,255,.75); font:700 9px/1 -apple-system, sans-serif; letter-spacing:.06em; color:#3a3438; opacity:0; transition:opacity .4s; }
  .cell .live i { width:9px; height:9px; border-radius:50%; border:1.5px dotted #3a3438; position:relative; }
  .cell .live i::after { content:''; position:absolute; inset:2px; border-radius:50%; background:#3a3438; }
  .cell.done .live { opacity:1; }
  .sticker { position:absolute; z-index:3; pointer-events:none; transform-origin:center; animation:pop .35s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform:scale(0) rotate(var(--r)); } to { transform:scale(1) rotate(var(--r)); } }

  /* 네 컷: 세로 띠 */
  #photo.strip { width:236px; padding:14px 12px 0; }
  #photo.strip .cells { gap:7px; }
  #photo.strip .cell { width:212px; height:159px; }
  .ttl { text-align:center; font:italic 600 15px/1.1 Georgia, "Times New Roman", serif; letter-spacing:.04em; margin:0 0 10px; }
  .ttl small { display:block; font:500 9px/1.4 -apple-system, sans-serif; letter-spacing:.18em; opacity:.6; font-style:normal; margin-top:3px; }
  .foot { display:flex; justify-content:space-between; align-items:center; font:500 9px/1 -apple-system, sans-serif; letter-spacing:.12em;
    opacity:.7; padding:12px 2px 14px; }
  /* 한 장: 폴라로이드 */
  #photo.single { width:300px; padding:14px 14px 0; }
  #photo.single .cell { width:272px; height:330px; }
  #photo.single .ttl { display:none; }
  #photo.single .foot { padding:16px 4px 20px; font:22px/1 "Nanum Pen Script", "Apple SD Gothic Neo", cursive; letter-spacing:0; opacity:.85; }
  #photo.single .foot b { font-weight:400; }

  /* 프레임 종류 */
  /* 필름: 양옆에 필름 구멍, 제목은 작은 대문자 */
  #photo[data-ft=film] { padding-left:24px !important; padding-right:24px !important; }
  #photo.strip[data-ft=film] { width:260px; }
  #photo.single[data-ft=film] { width:320px; }
  #photo[data-ft=film]::before, #photo[data-ft=film]::after { content:''; position:absolute; top:6px; bottom:6px; width:9px; z-index:2;
    background:repeating-linear-gradient(to bottom, transparent 0 5px, rgba(240,236,228,.9) 5px 13px, transparent 13px 18px); border-radius:2px; }
  #photo[data-ft=film]::before { left:7px; } #photo[data-ft=film]::after { right:7px; }
  #photo[data-ft=film] .ttl { font:600 9px/1 -apple-system, sans-serif; letter-spacing:.22em; font-style:normal; text-align:left; margin-bottom:8px; }
  #photo[data-ft=film] .ttl small { display:inline; margin-left:8px; }
  #photo[data-ft=film] .foot { font:600 7px/1 -apple-system, sans-serif !important; letter-spacing:.1em; white-space:nowrap; gap:8px; padding:10px 0 14px !important; opacity:.75; }
  #photo.single[data-ft=film] .ttl { display:block; }
  /* 폴라로이드: 제목 없이 아래 여백을 넓게, 손글씨 날짜 */
  #photo[data-ft=pola] .ttl { display:none; }
  #photo[data-ft=pola] { padding-top:12px !important; }
  #photo[data-ft=pola] .foot { padding:22px 6px 30px !important; }
  #photo.single[data-ft=pola] .foot { padding:30px 6px 44px !important; }
  #photo[data-ft=pola] .hand { font:20px/1 "Nanum Pen Script", "Apple SD Gothic Neo", cursive; letter-spacing:0; opacity:.8; }
  /* 얇은 테두리: 제목·아래 글씨 없이 사진만 꽉 */
  #photo[data-ft=thin] .ttl, #photo[data-ft=thin] .foot { display:none; }
  #photo[data-ft=thin] { padding:6px !important; }
  #photo.strip[data-ft=thin] { width:224px; }
  #photo.strip[data-ft=thin] .cells { gap:4px; }
  #photo.single[data-ft=thin] { width:284px; }

  .msgin { width:100%; box-sizing:border-box; border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; font:inherit; font-size:14px; color:var(--ink); }
  .foot .msg { max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:.02em; }
  #photo.single .foot .msg { letter-spacing:0; }
  /* 조절판 */
  .panel { background:var(--card); border-radius:18px; padding:14px 16px 16px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .row { margin:0 0 12px; }
  .lbl { font-size:12px; color:var(--muted); margin:0 0 6px; }
  #styleTabs { display:flex; gap:4px; width:max-content; margin:0 auto 14px; padding:4px; background:#e2dbd0; border-radius:999px; }
  #styleTabs button { border:0; background:transparent; border-radius:999px; padding:7px 18px; font:inherit; font-size:13px; color:var(--muted); }
  #styleTabs button.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .seg { display:flex; flex-wrap:wrap; gap:5px; }
  .seg button { flex:1 0 auto; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 8px; font:inherit; font-size:13px; color:var(--ink); }
  .seg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .seg.sw button { flex:0 0 34px; height:34px; padding:0; border-radius:50%; }
  .seg.sw button.on { box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
  .btns { display:flex; gap:6px; margin:4px 0 14px; }
  .btns button { flex:1; border:0; border-radius:12px; padding:12px 6px; font:inherit; font-size:13px; font-weight:600; background:var(--ink); color:#fff; }
  .btns button.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .lab { margin-top:12px; border:1.5px dashed var(--line); background:transparent; box-shadow:none; }
  .labrow { display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:13px; }
  .labrow span { flex:0 0 64px; color:var(--muted); }
  .labrow select { flex:1; min-width:0; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; font:inherit; font-size:13px; color:var(--ink); }
  .cuts { display:flex; flex-direction:column; gap:6px; }
  .cuts div { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 8px 7px 12px; font-size:13px; }
  .cuts b { font-weight:600; }
  .cuts span { color:var(--muted); font-size:11px; margin-left:6px; }
  .cuts button { border:0; background:#f1ebe2; border-radius:8px; padding:6px 10px; font:inherit; font-size:12px; color:var(--ink); }
  .note { font-size:11px; color:var(--muted); line-height:1.55; margin:12px 2px 0; }
  /* 6장에서 고르기 */
  .shead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:0 0 10px; font-size:14px; }
  #sheetMsg { font-size:11px; color:#b0455e; opacity:0; transition:opacity .25s; text-align:right; }
  #sheetMsg.on { opacity:1; }
  #sheet { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  .tile { position:relative; border:0; padding:0; border-radius:8px; overflow:hidden; background:#3a3438; cursor:pointer; box-shadow:0 0 0 1px var(--line); }
  .tile .th { position:absolute; inset:0; }
  .tile .th canvas { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .2s; }
  .tile.ready .th canvas { opacity:1; }
  .tile .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .tile .flash.go { animation:flash .5s ease-out; }
  .tile.on { box-shadow:0 0 0 3px var(--ink); }
  .tile .badge { position:absolute; left:6px; top:6px; min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--ink); color:#fff; font:700 12px/22px -apple-system, sans-serif; display:none; }
  .tile.on .badge { display:block; }
  .tile .tag { position:absolute; right:6px; bottom:6px; font:600 10px/1 -apple-system, sans-serif; color:#fff; background:rgba(0,0,0,.45); border-radius:6px; padding:3px 5px; }
  .tile .tag:empty { display:none; }
  #order { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  #order .ol { flex-basis:100%; font-size:11px; color:var(--muted); }
  #order button { border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 10px; font:inherit; font-size:13px; font-weight:600; color:var(--ink); display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  #order button small { font-weight:400; font-size:10px; color:var(--muted); }
  #order button.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  #order button.sel small { color:rgba(255,255,255,.7); }
  .btns button:disabled { opacity:.45; }
  .cell.empty { background:repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 6px, transparent 6px 12px); }
  .cell.empty .dim, .cell.empty .live { opacity:0 !important; }
  .cell.empty::after { content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:300 28px/1 -apple-system, sans-serif; opacity:.35; }
  header, #lab { display:none !important; }
  html, body { background:#d9829c; }
</style>

<body>
<div id="wrap">
  <header><h1>감사 스냅</h1><span>시안 v0 · 6장에서 골라 칸 채우기</span></header>
  <div id="styleTabs"><button data-v="strip">네 컷</button><button data-v="single">한 장</button></div>
  <div class="panel sheetp" style="margin-bottom:14px">
    <div class="shead"><b id="sheetHead">찍는 중…</b><span id="sheetMsg"></span></div>
    <div id="sheet"></div>
    <div id="order" hidden></div>
    <div class="btns" style="margin:12px 0 0"><button id="reshoot" class="sec">6장 다시 찍기</button></div>
  </div>
  <div id="stageBox">
    <div id="photo" class="strip">
      <canvas id="c"></canvas>
      <div class="ttl" id="ttl">thank you<small>FOR THE FLOWERS</small></div>
      <div class="cells" id="cells"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="panel lab" id="lab"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const V3 = THREE.Vector3;
// [꽃망울에 끼워 넣을 때 바꾼 곳] 본 앱이 ?d=(base64url JSON)으로 보낸 값: { a:건네는 사람 캐릭터, b:내 캐릭터, bq:받은 꽃다발 요약, rel, msg }
const INIT = (() => { try { const q = new URLSearchParams(location.search).get('d'); if (!q) return null; const b = q.replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4))))); } catch (e) { return null; } })();

// ---------- 재질 + PS1 꼭짓점 스냅 ----------
const PS1 = { uSnap:{ value:1 }, uRes:{ value:new THREE.Vector2(320,240) } };
function snappable(mat){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSnap = PS1.uSnap; sh.uniforms.uRes = PS1.uRes;
    sh.vertexShader = 'uniform float uSnap;\nuniform vec2 uRes;\n' + sh.vertexShader.replace('#include <project_vertex>',
      `#include <project_vertex>
      if (uSnap > 0.5) { vec4 sp = gl_Position; sp.xyz /= sp.w;
        sp.xy = floor(sp.xy * uRes * 0.5 + 0.5) / (uRes * 0.5); sp.xyz *= sp.w; gl_Position = sp; }`);
  };
  return mat;
}
const matCache = new Map();
function M(color){
  const key = new THREE.Color(color).getHexString();
  if (!matCache.has(key)) matCache.set(key, snappable(new THREE.MeshStandardMaterial({ color:'#'+key, flatShading:true, roughness:0.85, side:THREE.DoubleSide })));
  return matCache.get(key);
}
// ---------- 무늬 재질: 두 색 + 위치의 사인 합성 (uv 대신 3D 위치라 이음새가 없음) ----------
function furMaterial(c1, c2, kind, amt, size, seed, white=0, c3=WHITE_FUR, shell=-1){
  const mat = snappable(new THREE.MeshStandardMaterial({ color:c1, flatShading:true, roughness:0.85, side:THREE.DoubleSide }));
  const U = { uC2:{ value:new THREE.Color(c2) }, uKind:{ value:kind }, uAmt:{ value:amt }, uFreq:{ value:size }, uSeed:{ value:seed }, uWhite:{ value:white }, uC3:{ value:new THREE.Color(c3) }, uShell:{ value:shell }, uHatY:{ value:2.0 }, uFlat:{ value:0 }, uPatTop:{ value:9 } };
  const snap = mat.onBeforeCompile;
  mat.onBeforeCompile = sh => {
    snap(sh); Object.assign(sh.uniforms, U);
    sh.vertexShader = 'varying vec3 vPatPos;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvPatPos = position;');
    sh.fragmentShader = `uniform vec3 uC2, uC3; uniform float uKind, uAmt, uFreq, uSeed, uWhite, uShell, uHatY, uFlat, uPatTop; varying vec3 vPatPos;
      float furHash(vec3 c){ return fract(sin(dot(c, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
      float furPat(vec3 p){
        p = normalize(p); vec3 s = vec3(1.7, 2.3, 3.1) * uSeed;
        float f = mix(2.0, 9.0, uFreq);
        if (uKind < 0.5) return 0.0;
        if (uKind < 1.5){            // 점박이: 세 방향 사인의 곱
          float v = sin(p.x*f*2.0 + s.x) * sin(p.y*f*2.0 + s.y) * sin(p.z*f*2.0 + s.z);
          return step(0.62 - uAmt*0.75, v);
        } else if (uKind < 2.5){     // 얼룩: 낮은 주파수 사인의 합
          float v = sin(dot(p, vec3(1.3,0.7,0.4))*f*0.6 + s.x) + sin(dot(p, vec3(-0.5,1.1,0.8))*f*0.6 + s.y)
                  + 0.6*sin(dot(p, vec3(0.2,-0.9,1.2))*f + s.z);
          return step(1.6 - uAmt*3.0, v);
        }
        // 줄무늬: 머리 둘레 각도의 사인, 위아래로 물결치게
        float a = atan(p.x, p.z);
        float v = sin(a*f*1.3 + sin(p.y*4.0 + s.x)*1.2 + p.y*2.0);
        return step(1.0 - uAmt*1.6, v) * smoothstep(-0.25, 0.05, p.y);
      }
      // 흰 부분: 입 주위와 턱에서 시작해 미간으로 올라가는 ㅅ자 경계 (앞쪽 아래만)
      float whiteMask(vec3 p){
        if (uWhite <= 0.0) return 0.0;
        p = normalize(p);
        if (uFlat > 0.5) return step(p.y, mix(-0.85, 0.2, uWhite) + 0.015*sin(atan(p.x, p.z)*5.0 + uSeed));   // 일자 경계: 아래(배)부터 수평으로 차오름
        float edge = mix(-0.35, 0.75, uWhite) - 1.3*abs(p.x) + 0.04*sin(p.x*23.0 + uSeed);
        return step(p.y, edge) * smoothstep(-0.35, -0.05, p.z);
      }
    ` + sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, uC2, furPat(vPatPos) * step(normalize(vPatPos).y, uPatTop + 0.04*sin(atan(vPatPos.x, vPatPos.z)*6.0)));\ndiffuseColor.rgb = mix(diffuseColor.rgb, uC3, whiteMask(vPatPos));\n' +
      // 보송한 털(겹 껍질): 겹마다 높이 h. 털 한 올(작은 칸)마다 정해진 길이보다 높은 겹은 그리지 않음(디더 투명처럼 뚫림). 얼굴은 아주 짧게.
      'if (uShell >= 0.0) { vec3 q = normalize(vPatPos); float face = step(0.4, q.z) * step(q.y, 0.5);\n' +
      '  float len = furHash(floor(q * 46.0) + uSeed) * mix(1.0, 0.12, face);\n' +
      '  if (len < uShell || q.y > uHatY) discard; diffuseColor.rgb *= mix(0.72, 1.06, uShell); }');
  };
  mat.userData.U = U; return mat;
}
const WHITE_FUR = '#f4efe6', FURRY = ['dog','cat','fox','rabbit','dino','hamster','giraffe','bear'];   // 털 옵션까지 쓰는 종
const PATTERNED = [...FURRY, 'fish', 'bird'];   // 무늬·밝은 부분 옵션을 쓰는 종 (물고기는 털 없이 무늬만)
const shade = (c, dl, ds=0) => '#' + new THREE.Color(c).offsetHSL(0, ds, dl).getHexString();
function mesh(geo, color, p=[0,0,0], r=[0,0,0], s=[1,1,1]){
  const m = new THREE.Mesh(geo, M(color)); m.position.set(...p); m.rotation.set(...r); m.scale.set(...s); return m;
}

// ---------- 머리 표면 위치 ----------
const HEAD_C = new V3(0, 0.98, 0), HEAD_R = new V3(0.33, 0.29, 0.305), NECK_Y = 0.72;
let FACE_DEFORM = null;   // 사람 얼굴형: 머리 단위 구 위의 점을 옮기는 함수 (얼굴 부품도 같은 함수를 거쳐 표면에 붙음)
function makeFaceDeform(shape, flen=0.5){
  const sg = shape*2 - 1;   // -1 갸름 · 0 동글 · +1 사각
  return v => {
    if (v.y < 0) v.y *= 1 + (flen - 0.5)*0.6;   // 얼굴 길이: 눈 아래를 위아래로 늘이거나 줄임
    const t = Math.min(1, Math.max(0, (0.25 - v.y)/1.25));   // 볼 아래로 갈수록 1
    if (sg < 0){ const k = -sg; v.x *= 1 - 0.38*k*t; v.z *= 1 - 0.12*k*t; v.y -= 0.12*k*t*t; }   // 갸름: 턱이 좁고 길게
    else if (sg > 0){                                                                          // 사각: 아래쪽 단면을 네모로
      const k = sg, r = Math.hypot(v.x, v.z), a = Math.atan2(v.x, v.z);
      const sq = r / Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a)), 1e-3) * 0.9, w = k*t*0.8;
      v.x += (Math.sin(a)*sq - v.x)*w; v.z += (Math.cos(a)*sq - v.z)*w;
      v.y += (Math.max(v.y, -0.78) - v.y)*k*t;                                                 // 턱 끝을 평평하게
    }
    return v;
  };
}
function surf(yaw, pitch, out=0){
  let d = new V3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch));
  if (FACE_DEFORM) d = FACE_DEFORM(d);
  const p = new V3(d.x*HEAD_R.x, d.y*HEAD_R.y, d.z*HEAD_R.z).add(HEAD_C);
  const n = new V3(d.x/HEAD_R.x, d.y/HEAD_R.y, d.z/HEAD_R.z).normalize();
  return { p: p.addScaledVector(n, out), n };
}

function hairToShape(head, from, B, cyl, hatOn){
  const inv = new THREE.Matrix4(), mm = new THREE.Matrix4(), mi = new THREE.Matrix4(), v = new V3(), P = 6;
  head.updateMatrixWorld(true); inv.copy(head.matrixWorld).invert();
  const kids = head.children.slice(from), avg = (HEAD_R.x + HEAD_R.y + HEAD_R.z)/3;
  for (const k of kids) k.traverse(o => {
    if (!o.isMesh) return;
    o.geometry = o.geometry.clone();
    mm.multiplyMatrices(inv, o.matrixWorld); mi.copy(mm).invert();
    const pa = o.geometry.attributes.position;
    for (let i=0; i<pa.count; i++){
      v.fromBufferAttribute(pa, i).applyMatrix4(mm).sub(HEAD_C);
      const e = new V3(v.x/HEAD_R.x, v.y/HEAD_R.y, v.z/HEAD_R.z), rn = e.length(); if (rn < 1e-5) continue;
      const u = e.divideScalar(rn);
      const f = cyl ? Math.pow(Math.pow(Math.hypot(u.x, u.z), P) + Math.pow(Math.abs(u.y), P), 1/P)
                    : Math.pow(Math.pow(Math.abs(u.x), P) + Math.pow(Math.abs(u.y), P) + Math.pow(Math.abs(u.z), P), 1/P);
      const sp = new V3(u.x*B[0], u.y*B[1], u.z*B[2]).divideScalar(f), n = sp.clone().normalize();
      v.copy(sp).addScaledVector(n, (rn - 1)*avg*0.9 + 0.025);   // 화면 테두리 같은 앞면 장식 위로 조금 띄움
      if (hatOn) v.y = Math.min(v.y, B[1] + 0.005);   // 네모 모자 속으로
      v.add(HEAD_C).applyMatrix4(mi); pa.setXYZ(i, v.x, v.y, v.z);
    }
    o.geometry.computeVertexNormals(); o.geometry.computeBoundingSphere();
  });
}

    if (c.blur && lt >= SHOT) drawGhost(c, cam, bg, rw, rh, p);

    renderer.setScissorTest(true);

      const vy = H - (r.y + r.h);

      postMat.uniforms.uOff.value.set(0, (bot - (r.y + r.h))/ch); postMat.uniforms.uScale.value.set(1, r.h/ch);

}
// 잔상: 찰칵 직전 몇 순간을 겹쳐 그림(앞 순간일수록 옅게). 배경은 같아서 그대로, 움직인 부분만 흐릿한 꼬리가 남음
const mixMat = new THREE.ShaderMaterial({ uniforms:{ tA:{ value:null }, tB:{ value:null }, k:{ value:0.5 } },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`uniform sampler2D tA, tB; uniform float k; varying vec2 vUv; void main(){ gl_FragColor = mix(texture2D(tA, vUv), texture2D(tB, vUv), k); }`,
  depthTest:false, depthWrite:false });
const mixScene = new THREE.Scene(); mixScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mixMat));
const mkRT = () => new THREE.WebGLRenderTarget(16, 16, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });
function drawGhost(c, cam, bg, rw, rh, p){
  const key = rw + 'x' + rh; if (c.gKey === key) return;   // 이미 합성해 둔 정지 사진이면 그대로 씀
  if (!c.g1){ c.g1 = mkRT(); c.g2 = mkRT(); }
  [c.g1, c.g2].forEach(r => { if (r.width !== rw || r.height !== rh) r.setSize(rw, rh); });

  c.gKey = key;
}
// 반반 바꾸기: 칸마다 한 사람만 그리고, 각자의 눈 바로 아래 높이를 칸 경계에 맞춤. 두 사람의 얼굴 크기를 같게 맞추려고 카메라 거리를 몸 크기에 비례시킴
const _v = new V3();
function drawSwap(c, rs, bg, H){
  const [up, dn] = c.pose.swap === 'AB' ? [c.sc.A, c.sc.B] : [c.sc.B, c.sc.A];
  c.sc.scene.updateMatrixWorld(true);
  if (!c.rt2) c.rt2 = new THREE.WebGLRenderTarget(16, 16, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });
  [[up, rs[0], c.rt, 1], [dn, rs[1], c.rt2, -1]].forEach(([ch, r, rt, side]) => {
    const u = ch.userData, s = u.poseG.scale.x;
    u.eyes[0].getWorldPosition(_v); const ey = _v.y, ez = _v.z; u.headPivot.getWorldPosition(_v); const hx = _v.x;
    const cut = ey - 0.06*s, cam = c.sc.cam; cam.fov = 30; cam.aspect = r.w/r.h; cam.updateProjectionMatrix();
    const d = 1.25*s, Hh = 2*d*Math.tan(THREE.MathUtils.degToRad(15));
    cam.position.set(hx, cut + side*Hh/2, ez + d); cam.lookAt(hx, cut + side*Hh/2, ez);   // 얼굴 앞면 깊이에서 경계를 맞춤(원근 때문에 어긋나지 않게)
    c.sc.A.visible = ch === c.sc.A; c.sc.B.visible = ch === c.sc.B;
    const rh = Math.round(r.h*0.85), rw = Math.round(r.w*0.85);
    if (rt.width !== rw || rt.height !== rh) rt.setSize(rw, rh);
    PS1.uRes.value.set(rw, rh);
    renderer.setRenderTarget(rt); renderer.setClearColor(bg, 1); renderer.clear(); renderer.render(c.sc.scene, cam);
    renderer.setRenderTarget(null); renderer.setScissorTest(true);
    const vy = H - (r.y + r.h); renderer.setViewport(r.x, vy, r.w, r.h); renderer.setScissor(r.x, vy, r.w, r.h);
    postMat.uniforms.tDiffuse.value = rt.texture; postMat.uniforms.uSize.value.set(rw, rh);
    postMat.uniforms.uOff.value.set(0, 0); postMat.uniforms.uScale.value.set(1, 1);
    renderer.render(postScene, postCam); renderer.setScissorTest(false);
  });
  c.sc.A.visible = c.sc.B.visible = true;
  renderer.setViewport(0, 0, photo.clientWidth, H);
}
// 얼굴 들이밀기: 두 사람을 함께 찍되, 위 칸은 그대로·아래 칸은 둘의 좌우 자리를 바꿔서 찍음. 경계는 두 사람 눈 높이의 평균 바로 아래
function blit(rt, r, H){
  renderer.setRenderTarget(null); renderer.setScissorTest(true);
  const vy = H - (r.y + r.h); renderer.setViewport(r.x, vy, r.w, r.h); renderer.setScissor(r.x, vy, r.w, r.h);
  postMat.uniforms.tDiffuse.value = rt.texture; postMat.uniforms.uSize.value.set(rt.width, rt.height);
  postMat.uniforms.uOff.value.set(0, 0); postMat.uniforms.uScale.value.set(1, 1);
  renderer.render(postScene, postCam); renderer.setScissorTest(false);
}
function drawPair(c, rs, bg, H){
  const { A, B } = c.sc; c.sc.scene.updateMatrixWorld(true);
  if (!c.rt2) c.rt2 = new THREE.WebGLRenderTarget(16, 16, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });
  const eye = ch => { ch.userData.eyes[0].getWorldPosition(_v); return _v.clone(); };
  const ea = eye(A), eb = eye(B), sA = A.userData.poseG.scale.x, sB = B.userData.poseG.scale.x;
  const cut = (ea.y + eb.y)/2 - 0.06*(sA + sB)/2, ez = Math.max(ea.z, eb.z), yb = 0.3*Math.max(sA, sB);
  const cam = c.sc.cam, r0 = rs[0]; cam.fov = 30; cam.aspect = r0.w/r0.h; cam.updateProjectionMatrix();
  const Hh = Math.min(Math.max(0.3, cut - yb), 0.62), d = Hh/(2*Math.tan(THREE.MathUtils.degToRad(15)));   // 아래 칸 끝이 몸통 중간(몸 끝 경계가 안 보이게)
  const xa = A.position.x, xb = B.position.x, ra = A.rotation.y, rb = B.rotation.y;
  [[rs[0], c.rt, 1, false], [rs[1], c.rt2, -1, true]].forEach(([r, rt, side, swap]) => {
    if (swap){ A.position.x = xb; B.position.x = xa; A.rotation.y = -ra; B.rotation.y = -rb; }   // 아래 칸: 몸이 좌우로 바뀜
    cam.position.set(0, cut + side*Hh/2, ez + d); cam.lookAt(0, cut + side*Hh/2, ez);
    const rh = Math.round(r.h*0.85), rw = Math.round(r.w*0.85);
    if (rt.width !== rw || rt.height !== rh) rt.setSize(rw, rh);
    PS1.uRes.value.set(rw, rh);
    renderer.setRenderTarget(rt); renderer.setClearColor(bg, 1); renderer.clear(); renderer.render(c.sc.scene, cam);
    blit(rt, r, H);
  });
  A.position.x = xa; B.position.x = xb; A.rotation.y = ra; B.rotation.y = rb;
  renderer.setViewport(0, 0, photo.clientWidth, H);
}
function markCells(c, t){
    // 칸 위 표시: 대기(어둡게) → 3·2·1 → 찰칵 → LIVE
    c.slots.forEach(s => {
      const el = cells[s];
      el.querySelector('.dim').style.opacity = t < 0 ? 1 : 0;
      const cnt = el.querySelector('.count'); const n = t >= 0 && t < SHOT ? 3 - Math.floor(t/SHOT*3) : 0;
      cnt.style.opacity = n && s === c.slots[0] ? 1 : 0; cnt.textContent = n || '';
      if (t >= SHOT && !el.classList.contains('done')){ el.classList.add('done'); if (!c.shot){ const f = el.querySelector('.flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); } if (s === c.slots[0] && !c.pose.swap) addSticker(el); }
    });
    if (t >= SHOT) c.shot = true;
}

layout(); shoot(true, true); tick();
window.__snap = { ui, shoot, get cuts(){ return cuts; },
  setPoses(ids){ picks = []; renderSheet(); buildCuts(ids.map(id => POSE_POOL.find(p => p.id === id))); cells.forEach(c => c.classList.remove('done')); renderPanel(); },
  get pool6(){ return pool6; }, get picks(){ return picks; }, pickTile };   // 시험용
